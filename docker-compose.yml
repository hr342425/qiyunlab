services:
  mail:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${QIYUNLAB_IMAGE:-qiyunlab-mail:latest}
    container_name: ${QIYUNLAB_CONTAINER_NAME:-qiyunlab-mail}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env

  nginx:
    image: nginx:1.27-alpine
    container_name: ${QIYUNLAB_NGINX_CONTAINER_NAME:-qiyunlab-nginx}
    restart: unless-stopped
    depends_on:
      - mail
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
