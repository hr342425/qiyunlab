services:
  mail:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${QIYUNLAB_IMAGE:-qiyunlab-mail:latest}
    container_name: ${QIYUNLAB_CONTAINER_NAME:-qiyunlab-mail}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ${QIYUNLAB_NGINX_IMAGE:-qiyunlab-nginx:latest}
    container_name: ${QIYUNLAB_NGINX_CONTAINER_NAME:-qiyunlab-nginx}
    restart: unless-stopped
    depends_on:
      - mail
    ports:
      - "80:80"
    environment:
      - MAIL_API_KEY=${MAIL_API_KEY:-}
